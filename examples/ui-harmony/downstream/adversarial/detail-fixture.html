<!doctype html><style>body{margin:40px}.control{position:relative;width:160px;height:60px;margin-bottom:40px;border:1px solid #aaa}.part{position:absolute;top:20px;width:20px;height:20px;background:black}.a{left:10px}.b{left:120px}.paint{position:absolute;width:10px;height:10px;background:red;visibility:visible;top:0}.a .paint{left:50px}.b .paint{left:-60px}#outside{overflow:visible}#outside .paint{top:80px}#outside .a .paint{left:50px}#outside .b .paint{left:-60px}</style>
<div class="control" id="visible-child"><span class="part a"><span class="paint"></span></span><span class="part b"><span class="paint"></span></span></div>
<div class="control" id="outside"><span class="part a"><span class="paint"></span></span><span class="part b"><span class="paint"></span></span></div>
