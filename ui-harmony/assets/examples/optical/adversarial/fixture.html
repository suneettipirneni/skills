<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;margin:24px;background:white;color:#222}.cases{display:grid;grid-template-columns:repeat(4,160px);gap:24px}.frame{width:64px;height:64px;outline:1px solid #bbb;background:white;position:relative}.frame svg{display:block;width:64px;height:64px}.ink{fill:#111}.label{margin-top:8px}.low .satellite{fill:#fafafa}.quarter{transform:translate(.25px,.25px)}</style><div class="cases">
<section><div class="frame" id="square"><svg viewBox="0 0 64 64"><g class="ink"><rect x="16" y="16" width="32" height="32"/></g></svg></div><div class="label">Centered square</div></section>
<section><div class="frame" id="triangle"><svg viewBox="0 0 64 64"><g class="ink"><path d="M16 12 L48 32 L16 52Z"/></g></svg></div><div class="label">Directional triangle</div></section>
<section><div class="frame" id="circle"><svg viewBox="0 0 64 64"><g class="ink"><circle cx="32" cy="32" r="16"/></g></svg></div><div class="label">Equal-bounds circle</div></section>
<section><div class="frame" id="badge"><svg viewBox="0 0 64 64"><g class="ink"><rect class="base" x="16" y="20" width="28" height="24"/><circle class="badge" cx="47" cy="17" r="8"/></g></svg></div><div class="label">Base + badge</div></section>
<section><div class="frame low" id="threshold"><svg viewBox="0 0 64 64"><g class="ink"><rect x="12" y="20" width="24" height="24"/><rect class="satellite" x="45" y="16" width="15" height="32"/></g></svg></div><div class="label">Threshold-sensitive satellite</div></section>
<section><div class="frame" id="clipped"><svg viewBox="0 0 64 64"><defs><clipPath id="half"><rect width="32" height="64"/></clipPath></defs><g class="ink" clip-path="url(#half)"><circle cx="32" cy="32" r="16"/></g></svg></div><div class="label">Clipped circle</div></section>
<section><div class="frame" id="hollow"><svg viewBox="0 0 64 64"><g class="ink"><path fill-rule="evenodd" d="M16 16H48V48H16Z M20 20V44H44V20Z"/></g></svg></div><div class="label">Same bounds, hollow</div></section>
<section><div class="frame quarter" id="fractional"><svg viewBox="0 0 64 64"><g class="ink"><rect x="16" y="16" width="32" height="32"/></g></svg></div><div class="label">Fractional origin</div></section>
</div>
