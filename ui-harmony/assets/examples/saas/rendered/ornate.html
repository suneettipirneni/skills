<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Northstar work queue</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202329;font:14px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #c8ccd2;border-radius:6px;background:white;color:inherit;padding:7px 12px;min-height:36px}button:focus-visible{outline:3px solid #315ac5;outline-offset:3px}.brand{font-weight:650;letter-spacing:-.2px}.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}aside{background:#f7f8fa;padding:24px 16px;border-right:1px solid #e2e4e8}aside p{padding:8px 12px;margin:8px 0}aside .active{background:#e8ebf0;border-radius:6px;font-weight:600}.workspace{font-size:12px;color:#5e6672;margin-top:36px}main{padding:32px 40px;max-width:1320px;width:100%}.crumb{color:#5e6672;font-size:13px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0}h1{font-size:24px;line-height:1.2;letter-spacing:-.6px;margin:0 0 8px;font-weight:600}.summary{color:#5e6672;margin:0}.primary{background:#252931;color:white;border-color:#252931}.toolbar{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e2e4e8;padding:0 0 16px;margin-bottom:4px}.count{margin-left:auto;color:#5e6672}.row{display:grid;grid-template-columns:minmax(160px,1fr) 120px 70px 70px;align-items:center;gap:16px;border-bottom:1px solid #e7e9ed;padding:14px 4px}.row button{text-align:left;border:0;padding:0;background:none;font-weight:500;min-height:36px}.label{color:#5e6672}.status{font-size:12px;font-weight:500}.overdue{color:#9f2d19}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}.listhead{font-size:12px;color:#5e6672;padding-top:10px;padding-bottom:10px}.detail{padding:16px;background:#f6f7f9;border-radius:6px;margin-top:24px}footer{color:#5e6672;margin-top:24px;font-size:12px}
body.warm{background:#fffdf9;color:#342d25}.warm aside{background:#f4f0e8;border-color:#e3ddd3}.warm aside .active{background:#e9dfcf}.warm .primary{background:#5a4531;border-color:#5a4531}.warm .brand{font-family:Georgia,serif;font-size:19px}.warm .toolbar,.warm .row{border-color:#e4ded4}
.ornate{background:linear-gradient(145deg,#e8dfff,#f8f1ff)}.ornate main{background:#faf7ff;margin:20px;width:calc(100% - 40px);border:2px solid #c8a5ff;border-radius:28px;box-shadow:0 12px 35px #9471b944}.ornate aside{background:#d8c4ff}.ornate h1{font-size:42px;color:#6836aa}.ornate header{padding:24px;background:#ead8ff;border:2px solid #d1b3f6;border-radius:24px}.ornate .primary{background:linear-gradient(45deg,#7034a5,#a42180);border-radius:30px}.ornate .row{margin:14px 0;padding:20px;background:#fff;border:2px solid #d6b7f0;border-radius:24px;box-shadow:0 8px 18px #926eb42b}.ornate .status{padding:8px;background:#eee1ff;border-radius:20px;color:#653b86}.ornate button{border-radius:24px}
.sparse main{max-width:1100px;margin:auto}.sparse header{margin:55px 0 70px}.sparse h1{font-size:42px}.sparse .row{padding:48px 8px;margin:20px 0}.sparse .toolbar{padding-bottom:30px}.sparse footer{margin-top:60px}
.faint{color:#aaa}.faint .label,.faint .summary,.faint .crumb,.faint .count,.faint .status,.faint footer{color:#b5b5b5}.faint .primary{background:#f3f3f3;color:#aaa;border-color:#eee}.faint button{font-size:12px;min-height:22px;padding:2px 5px}.faint .row button{min-height:22px}.faint h1{font-size:18px}.faint .row{padding:10px 4px;border-color:#fafafa}
@media(max-width:600px){.shell{display:block}aside{display:none}main{padding:20px 16px}header{align-items:flex-start}.row{grid-template-columns:minmax(0,1fr) 95px;gap:6px 12px}.owner,.due{display:none}.listhead{display:none}.row button{overflow-wrap:anywhere}.ornate main{margin:8px;width:calc(100% - 16px);padding:16px}.ornate header{padding:16px;display:block}.ornate h1,.sparse h1{font-size:30px}.ornate .primary{margin-top:16px}.ornate .row{padding:16px}.sparse header{margin:32px 0 50px}.sparse .row{padding:40px 4px}.count{font-size:12px}}
</style><body class="ornate"><div class="shell"><aside><div class="brand">◈ Northstar</div><div class="workspace">WORKSPACE</div><p class="active">Work queue</p><p>Projects</p><p>Activity</p><p>Settings</p></aside><main><div class="crumb">Operations / Work queue</div><header><div><h1>Work queue</h1><p class="summary">Resolve exceptions and keep work moving.</p></div><button class="primary" id="new">New task</button></header><div class="toolbar"><button id="filter">All tasks</button><button id="sort">Due date ↓</button><span class="count">4 tasks · 1 overdue</span></div><div class="listhead row"><span>Task</span><span>Status</span><span class="owner">Owner</span><span class="due">Due</span></div><div class="row taskrow"><button data-task="0">Restore webhook delivery</button><span class="status overdue"><span class="dot"></span>Overdue</span><span class="label owner">Maya</span><span class="label due">Today</span></div><div class="row taskrow"><button data-task="1">Review account permissions</button><span class="status "><span class="dot"></span>In progress</span><span class="label owner">Noah</span><span class="label due">Nov 18</span></div><div class="row taskrow"><button data-task="2">Update billing email</button><span class="status "><span class="dot"></span>Ready</span><span class="label owner">Maya</span><span class="label due">Nov 20</span></div><div class="row taskrow"><button data-task="3">Export audit history</button><span class="status "><span class="dot"></span>Ready</span><span class="label owner">Liam</span><span class="label due">Nov 21</span></div><div class="detail" id="detail" hidden tabindex="-1"></div><footer>Updated just now · All changes saved</footer></main></div><script>document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>{const d=document.querySelector('#detail');d.hidden=false;d.textContent=b.textContent+' — Review the task history and next step.';d.focus()}));</script>
